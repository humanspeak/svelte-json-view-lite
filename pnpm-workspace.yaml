packages:
    - .
    - docs
allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/e65933a409be4be8d4663220d0271e3f0e654ab5': true
    esbuild: true
    sharp: true
    workerd: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
# pnpm 11 no longer reads pnpm.onlyBuiltDependencies from package.json.
# docs-kit is a git-hosted dependency whose prepare script builds dist/.
onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
