packages:
    - .
    - docs
allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/a474a0725babdda6f267951a578d14289037b0cc': true
    esbuild: true
    sharp: true
    workerd: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
# pnpm 11 no longer reads pnpm.onlyBuiltDependencies from package.json.
# docs-kit is a git-hosted dependency whose prepare script builds dist/.
onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
