packages:
    - .
    - docs
allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/728b1f534ebcf10674a04839cbd987d7e000be16': true
    esbuild: true
    sharp: true
    workerd: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
# pnpm 11 no longer reads pnpm.onlyBuiltDependencies from package.json.
# docs-kit is a git-hosted dependency whose prepare script builds dist/.
onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
