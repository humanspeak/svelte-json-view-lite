packages:
    - .
    - docs
allowBuilds:
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/7f9018cb91c5497c7ebd2bfca2c28aab9e1116ae': true
    esbuild: true
    sharp: true
    workerd: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
# pnpm 11 no longer reads pnpm.onlyBuiltDependencies from package.json.
# docs-kit is a git-hosted dependency whose prepare script builds dist/.
onlyBuiltDependencies:
    - '@humanspeak/docs-kit'
